# kumi routing evals
#
# Each case is a user prompt and the specialist that should handle it.
# check_cases.py checks the set is well-formed; a human (or Claude Code)
# checks that the expected skill actually fires.
#
# Fields:
#   prompt  - what the user would type
#   expect  - the skill that should handle it (a folder under skills/)
#   why     - the routing signal that makes it unambiguous

cases:
  # Coordinator: multi-role or "who should do this" requests route to yui.
  - prompt: "build a REST endpoint that lists projects, with tests, and review it before I ship"
    expect: yui
    why: spans design, build, and review, a sequenced feature, which is the coordinator's job

  - prompt: "who should handle adding a new column to the dashboard and testing it"
    expect: yui
    why: asks for routing, not for the work itself

  # yui must ask a clarifying question for a vague request, and must not ask
  # one when the request is already precise. must/must_not name the behavior
  # a grader checks for, not the exact wording.
  - prompt: "I want a button on my site that lets people sign up for updates by email"
    expect: yui
    why: names no specialist and is missing what to build, where it goes, or what done looks like
    must: "asks a clarifying question before proposing a plan"
    must_not: "starts dispatching a specialist without asking anything first"

  - prompt: "add a paginated Go endpoint for recent activity and a React panel for it, with tests and review"
    expect: yui
    why: names no specialist and is already precise about what to build, where it goes, and what done looks like
    must: "states a one-line plan and asks for a go-ahead, without any clarifying question"
    must_not: "asks the user any clarifying question before proposing the plan"

  # A search request's dispatch brief must name every place to look, not just one.
  - prompt: "find every place in this repo that reads .kumi/overrides.json and dispatch a specialist to list them"
    expect: yui
    why: a multi-file search whose dispatch brief needs a "where to look" part naming more than one location
    must: "the dispatch brief's where-to-look part names more than one location to search"
    must_not: "the dispatch brief omits where to look, or names only a single file"

  # Architecture (cross-cutting: design before code, any stack).
  - prompt: "design the shape of a new pagination API before we write any code"
    expect: kai
    why: design and spec before code, which is the architect's job in any stack

  # Go: implementer, debugger, reviewer.
  - prompt: "add a Go handler that returns the list of active users as JSON"
    expect: jaan
    why: writing a new Go feature

  - prompt: "the TestUserList Go test panics with a nil pointer, find and fix it"
    expect: siim
    why: a specific Go bug to reproduce and fix

  - prompt: "review this Go service for security and concurrency issues before merge"
    expect: mart
    why: read-only Go quality/security review

  # Angular: implementer, debugger, reviewer.
  - prompt: "add an Angular component that shows a filterable table of orders"
    expect: liis
    why: writing a new Angular feature

  - prompt: "the Angular route guard redirects in a loop, find and fix the cause"
    expect: kadi
    why: a specific Angular bug to reproduce and fix

  - prompt: "review the new Angular dashboard component for change-detection problems"
    expect: tiiu
    why: read-only Angular review

  # iOS: implementer, debugger, reviewer.
  - prompt: "add a SwiftUI settings screen with a toggle bound to app storage"
    expect: ren
    why: writing a new iOS feature

  - prompt: "the iOS list crashes on scroll with an index out of range, fix it"
    expect: shu
    why: a specific iOS bug to reproduce and fix

  - prompt: "review this Swift view model for memory safety and retain cycles"
    expect: ryo
    why: read-only iOS review

  # Ops.
  - prompt: "the dev server is still holding port 4200, stop it and confirm the port is free"
    expect: enn
    why: starting/stopping/inspecting processes and ports

  # DevOps / infra.
  - prompt: "write a Dockerfile for this Go service and a GitHub Actions workflow to build and push the image"
    expect: sora
    why: Dockerfile and CI/CD pipeline work, DevOps/infra's job

  # Python: implementer, debugger, reviewer.
  - prompt: "add a Python function that parses the CSV and returns typed rows"
    expect: eero
    why: writing a new Python feature

  - prompt: "this pytest fails with a KeyError in the parser, find and fix it"
    expect: anu
    why: a specific Python bug to reproduce and fix

  - prompt: "review this Python module for security and error handling before merge"
    expect: ivo
    why: read-only Python review

  # React: implementer, debugger, reviewer.
  - prompt: "add a React component with a hook that fetches and lists orders"
    expect: noa
    why: writing a new React feature

  - prompt: "the React list re-renders on every keystroke and loses focus, fix it"
    expect: rui
    why: a specific React bug to reproduce and fix

  - prompt: "review this React component for re-renders and accessibility before I ship"
    expect: aki
    why: read-only React review

  # Data stores.
  - prompt: "design the schema and a safe migration to add an orders table with an index"
    expect: saku
    why: relational schema, query, and migration work

  - prompt: "model a DynamoDB table for reading a user's recent activity efficiently"
    expect: remo
    why: document/key-value data modeling and access patterns
