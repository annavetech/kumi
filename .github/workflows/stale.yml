name: stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          exempt-issue-labels: "priority/p0,priority/p1,do-not-merge/hold,good first issue,help wanted"
          stale-issue-message: >
            This issue has had no activity for 60 days. It will close in 7
            days if nothing changes. Comment, or remove the stale label, to
            keep it open.
          close-issue-message: >
            Closing due to inactivity. Reopen if this is still relevant.
          days-before-pr-stale: -1
          days-before-pr-close: -1
