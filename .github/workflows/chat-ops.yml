name: chat-ops

on:
  issue_comment:
    types: [created]

# Shares the concurrency group with merge-gate.yml so a chat command and a
# push to the same PR do not race; the last one to finish sets the status.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write
  statuses: write

jobs:
  chat-ops:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Handle chat command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/chat_commands.py
