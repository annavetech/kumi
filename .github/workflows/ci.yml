name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CI-only tooling
        run: python3 -m pip install -r requirements.txt
      - name: Enable coverage for subprocesses
        run: |
          python3 -c "
          import sysconfig, pathlib
          p = pathlib.Path(sysconfig.get_path('purelib')) / 'coverage_subprocess.pth'
          p.write_text('import coverage; coverage.process_startup()\n')
          "
      # Runs the test suite (skill validator, routing eval check, agents-in-sync check) under coverage.
      # COVERAGE_FILE is an absolute path because hooks run as subprocesses in their own temp dir.
      - name: Run the kumi test suite under coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          coverage run --rcfile=.coveragerc tests/run_tests.py
          coverage combine
          coverage report --rcfile=.coveragerc --fail-under=60

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt
      - run: ruff check hooks scripts tests evals .github/scripts

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt
      # pull_request_template.md is excluded because GitHub's PR form already
      # supplies a title, so the template starts at ## and would fail MD041.
      - run: pymarkdown --config .pymarkdown.json scan -r . -e .github/pull_request_template.md

  validate-claude-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      # Installs the claude CLI pinned by .github/claude-cli/package-lock.json.
      - name: Install claude CLI (npm, pinned by lockfile)
        working-directory: .github/claude-cli
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/.github/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      # "." validates marketplace.json and plugin.json (kumi lists itself as a plugin entry), but not skill or agent files.
      # ./skills and ./agents run separately to cover every SKILL.md and agents/*.md.
      - name: Validate the plugin and marketplace manifests
        run: |
          claude plugin validate .
          claude plugin validate ./skills
          claude plugin validate ./agents
      - name: Validate the plugin and marketplace manifests (strict)
        run: |
          claude plugin validate . --strict
          claude plugin validate ./skills --strict
          claude plugin validate ./agents --strict
