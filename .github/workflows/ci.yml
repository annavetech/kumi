name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runs the whole suite: the skill validator, the routing eval check, the
      # agents-in-sync check, and the negative cases (malformed skills rejected,
      # hooks never fail). Standard library only, so there is nothing to install.
      - name: Run the kumi test suite
        run: python3 tests/run_tests.py
