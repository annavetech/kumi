      - any-glob-to-any-file: ["skills/**"]

area/agents:
  - changed-files:
      - any-glob-to-any-file: ["agents/**"]

area/hooks:
  - changed-files:
      - any-glob-to-any-file: ["hooks/**"]

area/scripts:
  - changed-files:
      - any-glob-to-any-file: ["scripts/**"]

area/tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "evals/**"]

area/docs:
